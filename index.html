<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faisal Gym - Face ID Attendance</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <span class="logo">FG</span>
                <h1>Faisal Gym</h1>
            </div>
            <div id="statusBadge" class="badge loading">Loading Models...</div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="showTab('attendanceTab')">Attendance</button>
            <button class="tab-btn" onclick="showTab('membersTab')">Members</button>
            <button class="tab-btn" onclick="showTab('addTab')">Add Member</button>
        </nav>

        <main>
            <section id="attendanceTab" class="tab-content active">
                <div class="card">
                    <h3>Face ID Attendance</h3>
                    <p class="subtitle">Stand in front of the camera to check in</p>
                    <div class="video-wrapper">
                        <video id="video" width="320" height="240" autoplay muted playsinline></video>
                        <canvas id="canvas" width="320" height="240"></canvas>
                    </div>
                    <div id="alertBox" class="alert-box muted">Awaiting scanner...</div>
                </div>
            </section>

            <section id="membersTab" class="tab-content">
                <div class="card">
                    <h3>Registered Members (<span id="totalMembers">0</span>)</h3>
                    <ul id="membersList" class="members-list"></ul>
                </div>
            </section>

            <section id="addTab" class="tab-content">
                <div class="card">
                    <h3>Register New Member</h3>
                    <form id="addMemberForm">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="memberName" required placeholder="Enter member name">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="memberPhone" required placeholder="03001234567">
                        </div>
                        <div class="form-group">
                            <label>Monthly Fee (PKR)</label>
                            <input type="number" id="memberFee" required placeholder="2000">
                        </div>
                        <div class="form-group">
                            <label>Joining Date</label>
                            <input type="date" id="memberJoinDate" required>
                        </div>
                        <div class="form-group">
                            <label>Membership Expiry Date</label>
                            <input type="date" id="memberExpiryDate" required>
                        </div>
                        <div class="camera-snapshot-box">
                            <button type="button" class="btn secondary" onclick="captureSnapshot()">Capture Face ID</button>
                            <span id="captureStatus" class="status-text"></span>
                        </div>
                        <button type="submit" class="btn primary">Save Member</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
