<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faisal Gym - Management & Attendance System</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Direct Face-API and CDN Model Weights Script -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script defer src="app.js"></script>
</head>
<body>

  <!-- Header Section with Logo & Clock -->
  <header class="app-header">
    <div class="logo-container">
      <img src="https://i.postimg.cc/nc5QL4bG/FB-IMG-1785949977671.jpg" alt="Faisal Gym Logo" class="gym-logo">
      <div class="brand-title">FAISAL <span>GYM</span></div>
    </div>
    <div class="header-right">
      <div id="liveClock" class="live-clock">00:00:00 AM</div>
      <div id="systemStatus" class="status-badge loading">System Loading...</div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('attendance')">Attendance</button>
    <button class="tab-btn" onclick="switchTab('todayLogs')">Today Logs</button>
    <button class="tab-btn" onclick="switchTab('members')">Members</button>
    <button class="tab-btn" onclick="switchTab('addMember')">Add Member</button>
  </nav>

  <main class="container">
    
    <!-- Analytics Quick Stats Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <span id="totalActiveMembers">0</span>
        <label>Active Members</label>
      </div>
      <div class="stat-box">
        <span id="todayAttendanceCount">0</span>
        <label>Today Attendance</label>
      </div>
      <div class="stat-box overdue">
        <span id="overdueCount">0</span>
        <label>Fee Overdue</label>
      </div>
    </div>

    <!-- Tab 1: Attendance Scanner -->
    <div id="attendanceTab" class="tab-content active">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Face ID Live Attendance</h3>
        </div>
        <div class="video-wrapper">
          <video id="video" autoplay muted playsinline></video>
        </div>
        <div id="attendanceAlert" class="alert-box">Awaiting scanner...</div>
      </div>
    </div>

    <!-- Tab 2: Today Logs -->
    <div id="todayLogsTab" class="tab-content">
      <div class="card">
        <h3 class="card-title">Today's Attendance Feed</h3>
        <p class="subtitle" style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Auto resets daily at midnight.</p>
        <ul id="logsList" class="data-list"></ul>
      </div>
    </div>

    <!-- Tab 3: Member List & Search -->
    <div id="membersTab" class="tab-content">
      <div class="card">
        <h3 class="card-title">Registered Gym Members</h3>
        <div class="search-box">
          <input type="text" id="memberSearch" class="form-input" placeholder="Search by ID (e.g. A1) or Name..." oninput="handleSearch()">
        </div>
        <ul id="membersList" class="data-list"></ul>
      </div>
    </div>

    <!-- Tab 4: Add New Member -->
    <div id="addMemberTab" class="tab-content">
      <div class="card">
        <h3 class="card-title">Register New Member</h3>
        <div class="video-wrapper small">
          <video id="registerVideo" autoplay muted playsinline></video>
        </div>
        <div class="form-group">
          <label>Member Name</label>
          <input type="text" id="memberName" class="form-input" placeholder="Enter Full Name">
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="memberPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
        
        <div class="form-group">
          <label>📅 Admission Date</label>
          <input type="date" id="admissionDate" class="form-input">
        </div>
        
        <div class="form-group">
          <label>📅 Expiry Date (Fee Due Date)</label>
          <input type="date" id="expiryDate" class="form-input">
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="button" class="btn btn-secondary" style="padding:6px; font-size:12px;" onclick="setQuickExpiry(1)">+1 Month</button>
            <button type="button" class="btn btn-secondary" style="padding:6px; font-size:12px;" onclick="setQuickExpiry(3)">+3 Months</button>
            <button type="button" class="btn btn-secondary" style="padding:6px; font-size:12px;" onclick="setQuickExpiry(6)">+6 Months</button>
          </div>
        </div>

        <button class="btn btn-primary" onclick="registerMember()" style="margin-top:10px;">Capture Face & Register Member</button>
      </div>
    </div>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      const admInput = document.getElementById('admissionDate');
      if (admInput && !admInput.value) {
        admInput.value = today;
        setQuickExpiry(1);
      }
    });

    function setQuickExpiry(months) {
      const admInput = document.getElementById('admissionDate');
      const expInput = document.getElementById('expiryDate');
      let baseDate = admInput && admInput.value ? new Date(admInput.value) : new Date();
      
      baseDate.setMonth(baseDate.getMonth() + months);
      expInput.value = baseDate.toISOString().split('T')[0];
    }
  </script>
</body>
</html>
