<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Management System</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent-color: #ff9800;
      --text-color: #f0f6fc;
      --green-color: #00e676;
      --red-color: #ff1744;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
    }

    /* Header & Branding */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
    }

    .brand h1 {
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .digital-clock {
      font-size: 1.1rem;
      font-weight: bold;
      background: #000;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }

    /* Layout Sections */
    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
    }

    /* Scanner View */
    .scanner-box {
      position: relative;
      width: 100%;
      height: 260px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
      z-index: 10;
    }

    .scan-overlay.green {
      display: block;
      background: rgba(0, 230, 118, 0.85);
      color: #000;
      border: 2px solid var(--green-color);
    }

    .scan-overlay.red {
      display: block;
      background: rgba(255, 23, 68, 0.85);
      color: #fff;
      border: 2px solid var(--red-color);
    }

    /* Controls & Form Inputs */
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0d0f12;
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-danger {
      background: var(--red-color);
      color: #fff;
    }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }

    /* Photo Capture Box */
    .capture-area {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .photo-preview {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      background: #000;
      border: 1px solid var(--border-color);
      object-fit: cover;
    }

    /* Search & Member List */
    .search-box {
      margin-bottom: 15px;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0d0f12;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .member-item img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .member-info {
      flex: 1;
    }

    .member-info h4 {
      font-size: 1rem;
      color: #fff;
    }

    .member-info p {
      font-size: 0.8rem;
      color: #8b949e;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge-green { background: var(--green-color); color: #000; }
    .badge-red { background: var(--red-color); color: #fff; }

    .action-btns {
      display: flex;
      gap: 5px;
    }

    .action-btns button {
      padding: 6px 8px;
      font-size: 0.8rem;
      margin-top: 0;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="brand">
      <img src="logo.png" alt="Gym Logo" id="gymLogo">
      <h1>FAISAL GYM</h1>
    </div>
    <div class="digital-clock" id="clock">00:00:00 AM</div>
  </header>

  <div class="container">
    
    <!-- Module 1: Live Scanner -->
    <div class="card">
      <div class="card-title">Live Back-Camera Scanner</div>
      <div class="scanner-box">
        <video id="scannerVideo" autoplay playsinline></video>
        <div id="scanOverlay" class="scan-overlay">
          <div id="scanName">Member Name</div>
          <small id="scanStatus">STATUS</small>
        </div>
      </div>
      <button onclick="triggerManualScan()" style="margin-top: 12px;">Simulate Scan Entry</button>
    </div>

    <!-- Module 2: Member Registration & Profile -->
    <div class="card">
      <div class="card-title">Member Registration / Edit</div>
      <form id="memberForm" onsubmit="saveMember(event)">
        <input type="hidden" id="editIndex" value="-1">
        
        <input type="text" id="mName" placeholder="Full Name" required>
        <input type="tel" id="mPhone" placeholder="Mobile Number (e.g. 923001234567)" required>
        
        <div style="display: flex; gap: 10px;">
          <input type="date" id="mAdminDate" required>
          <input type="date" id="mExpDate" required>
        </div>

        <div class="capture-area">
          <img id="photoPreview" class="photo-preview" src="https://via.placeholder.com/60" alt="Preview">
          <button type="button" onclick="capturePhoto()">Capture Photo</button>
        </div>

        <button type="submit" id="saveBtn" style="margin-top: 12px;">Save Member Profile</button>
      </form>
    </div>

  </div>

  <!-- Module 3: Search & Member Administration -->
  <div class="card" style="margin-top: 20px;">
    <div class="card-title">Member Search & Administration</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by Name or Membership ID (e.g., A-1)..." onkeyup="renderMembers()">
    </div>
    
    <div class="member-list" id="memberList">
      <!-- Dynamic Member Items Will Render Here -->
    </div>
  </div>

  <script>
    // --- Data Storage ---
    let members = JSON.parse(localStorage.getItem('gym_members')) || [];
    let capturedImageData = '';

    // --- Digital Clock ---
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Audio Feedback Cues ---
    function playAudioCue(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'ok') {
        osc.frequency.setValueAtTime(880, ctx.currentTime); // High pitch OK
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime); // Low pitch Beep
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      }
    }

    // --- Back Camera Setup ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        document.getElementById('scannerVideo').srcObject = stream;
      } catch (err) {
        // Fallback to default camera if exact back camera isn't accessible
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          document.getElementById('scannerVideo').srcObject = fallbackStream;
        } catch (e) {
          console.error("Camera access error: ", e);
        }
      }
    }
    initCamera();

    // --- Capture Photo for Registration ---
    function capturePhoto() {
      const video = document.getElementById('scannerVideo');
      const canvas = document.createElement('canvas');
      canvas.width = 150;
      canvas.height = 150;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 150, 150);
      capturedImageData = canvas.toDataURL('image/png');
      document.getElementById('photoPreview').src = capturedImageData;
    }

    // --- Auto ID Generation (Format: A-1, A-2) ---
    function generateNextID() {
      if (members.length === 0) return 'A-1';
      const lastItem = members[members.length - 1];
      const parts = lastItem.id.split('-');
      const nextNum = parseInt(parts[1] || '0') + 1;
      return `A-${nextNum}`;
    }

    // --- Save / Edit Member ---
    function saveMember(e) {
      e.preventDefault();
      const editIndex = parseInt(document.getElementById('editIndex').value);
      
      const name = document.getElementById('mName').value.trim();
      const phone = document.getElementById('mPhone').value.trim();
      const adminDate = document.getElementById('mAdminDate').value;
      const expDate = document.getElementById('mExpDate').value;
      const photo = capturedImageData || 'https://via.placeholder.com/60';

      if (editIndex === -1) {
        // New Record
        const newMember = {
          id: generateNextID(),
          name,
          phone,
          adminDate,
          expDate,
          photo
        };
        members.push(newMember);
      } else {
        // Update Existing Record
        members[editIndex].name = name;
        members[editIndex].phone = phone;
        members[editIndex].adminDate = adminDate;
        members[editIndex].expDate = expDate;
        if (capturedImageData) members[editIndex].photo = capturedImageData;
        document.getElementById('editIndex').value = -1;
        document.getElementById('saveBtn').innerText = 'Save Member Profile';
      }

      localStorage.setItem('gym_members', JSON.stringify(members));
      document.getElementById('memberForm').reset();
      document.getElementById('photoPreview').src = 'https://via.placeholder.com/60';
      capturedImageData = '';
      renderMembers();
    }

    // --- Edit Member Profile ---
    function editMember(index) {
      const m = members[index];
      document.getElementById('mName').value = m.name;
      document.getElementById('mPhone').value = m.phone;
      document.getElementById('mAdminDate').value = m.adminDate;
      document.getElementById('mExpDate').value = m.expDate;
      document.getElementById('photoPreview').src = m.photo;
      document.getElementById('editIndex').value = index;
      document.getElementById('saveBtn').innerText = 'Update Member Profile';
    }

    // --- Delete Member Profile ---
    function deleteMember(index) {
      if (confirm('Are you sure you want to delete this member?')) {
        members.splice(index, 1);
        localStorage.setItem('gym_members', JSON.stringify(members));
        renderMembers();
      }
    }

    // --- Send WhatsApp Message ---
    function sendWhatsApp(phone, name, id, isPaid) {
      const msg = isPaid 
        ? `Dear ${name} (ID: ${id}), your gym fee payment is confirmed. Thank you!`
        : `Dear ${name} (ID: ${id}), your gym fee is due. Please clear your payment.`;
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    // --- Render Member List with Search ---
    function renderMembers() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const listContainer = document.getElementById('memberList');
      listContainer.innerHTML = '';

      const today = new Date().toISOString().split('T')[0];

      members.forEach((m, index) => {
        if (m.name.toLowerCase().includes(query) || m.id.toLowerCase().includes(query)) {
          const isPaid = m.expDate >= today;
          
          const item = document.createElement('div');
          item.className = 'member-item';
          item.innerHTML = `
            <img src="${m.photo}" alt="Member Photo">
            <div class="member-info">
              <h4>${m.name} <span class="badge ${isPaid ? 'badge-green' : 'badge-red'}">${m.id}</span></h4>
              <p>Phone: ${m.phone}</p>
              <p>Expires: ${m.expDate} (${isPaid ? 'PAID' : 'DUE'})</p>
            </div>
            <div class="action-btns">
              <button class="btn-whatsapp" onclick="sendWhatsApp('${m.phone}', '${m.name}', '${m.id}', ${isPaid})">WA</button>
              <button onclick="editMember(${index})">Edit</button>
              <button class="btn-danger" onclick="deleteMember(${index})">Delete</button>
            </div>
          `;
          listContainer.appendChild(item);
        }
      });
    }

    // --- Live Scanner Visual Feedback Simulation ---
    function triggerManualScan() {
      if (members.length === 0) {
        alert('No members found. Please register a member first.');
        return;
      }

      // Pick a member to simulate detection
      const randomMember = members[Math.floor(Math.random() * members.length)];
      const today = new Date().toISOString().split('T')[0];
      const isPaid = randomMember.expDate >= today;

      const overlay = document.getElementById('scanOverlay');
      const scanName = document.getElementById('scanName');
      const scanStatus = document.getElementById('scanStatus');

      scanName.innerText = `${randomMember.name} (${randomMember.id})`;
      
      if (isPaid) {
        overlay.className = 'scan-overlay green';
        scanStatus.innerText = 'FEE PAID - ACCESS GRANTED';
        playAudioCue('ok');
      } else {
        overlay.className = 'scan-overlay red';
        scanStatus.innerText = 'FEE DUE - OVERDUE';
        playAudioCue('beep');
      }

      setTimeout(() => {
        overlay.className = 'scan-overlay';
      }, 3000);
    }

    // Initial Render
    renderMembers();
  </script>
</body>
</html>
