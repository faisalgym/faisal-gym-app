<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faisal Gym Management</title>
<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent: #ff9800;
        --accent-hover: #e68a00;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --border: #334155;
        --danger: #ef4444;
        --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); padding: 15px; line-height: 1.5; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-container img { height: 50px; width: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
    .logo-container h1 { font-size: 1.3rem; color: var(--accent); }
    
    .digital-clock { font-size: 1rem; font-weight: bold; background: #000; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); }

    .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem; }
    .form-group input[readonly] { background: #1e293b; color: var(--accent); font-weight: bold; }
    
    /* Camera Styling */
    .camera-box { text-align: center; margin-bottom: 15px; }
    video { width: 100%; height: 220px; background: #000; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
    canvas { display: none; }
    .photo-preview { width: 100%; height: 220px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed var(--border); }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    
    .btn { background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; margin-top: 5px; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-whatsapp { background: #25D366; color: white; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
    .btn-whatsapp:hover { background: #1da851; }
    
    /* Table Styling */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #0f172a; color: var(--text-sub); }
    
    .member-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
    .badge-code { background: var(--accent); color: #000; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .badge-status { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-paid { background: var(--success); color: #000; }
    .badge-due { background: var(--danger); color: #fff; }
    
    .actions-cell { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="https://i.postimg.cc/3RX1JwMh/FB-IMG-1785949977671.jpg" alt="Gym Logo">
            <h1>FAISAL GYM</h1>
        </div>
        <div class="digital-clock" id="clock">00:00:00 AM</div>
    </header>

    <div class="main-grid">
        <!-- Add Member Form -->
        <div class="card">
            <h2>Naya Member Register Karein</h2>
            <form id="memberForm">
                <div class="form-group">
                    <label>Auto Member Code</label>
                    <input type="text" id="memberCode" readonly placeholder="Generating...">
                </div>
                
                <div class="form-group">
                    <label>Pura Naam</label>
                    <input type="text" id="fullName" required placeholder="Member Naam">
                </div>
                
                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="whatsapp" required placeholder="03451234567">
                </div>
                
                <div class="form-group">
                    <label>Admission Date</label>
                    <input type="date" id="admissionDate" required>
                </div>
                
                <div class="form-group">
                    <label>Expiry Date (Auto +1 Month)</label>
                    <input type="date" id="expiryDate" readonly>
                </div>

                <!-- Back Camera Section -->
                <div class="camera-box">
                    <label style="display:block; text-align:left; font-size:0.85rem; color:var(--text-sub); margin-bottom:5px;">Member Photo (Back Camera)</label>
                    <div id="cameraArea">
                        <video id="video" autoplay playsinline muted></video>
                    </div>
                    <div id="previewArea" class="photo-preview" style="display:none;">
                        <img id="capturedImage" src="" alt="Captured Photo">
                    </div>
                    <canvas id="canvas" width="320" height="240"></canvas>
                    
                    <button type="button" class="btn btn-secondary" id="snapBtn" style="margin-top:8px;">📸 Tasveer Khainchein</button>
                    <button type="button" class="btn btn-secondary" id="retakeBtn" style="margin-top:8px; display:none;">🔄 Retake Photo</button>
                </div>

                <button type="submit" class="btn">Save Member Profile</button>
            </form>
        </div>

        <!-- Members List -->
        <div class="card">
            <h2>Members List & Search</h2>
            <input type="text" id="searchInput" placeholder="Naam ya ID (e.g. A-1) se search karein..." onkeyup="renderTable()" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border); border-radius:6px; color:#fff; margin-bottom:15px;">
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Dates</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="membersTable">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let members = JSON.parse(localStorage.getItem('gym_members')) || [];
    let capturedPhotoData = "";
    let videoStream = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const capturedImage = document.getElementById('capturedImage');
    const cameraArea = document.getElementById('cameraArea');
    const previewArea = document.getElementById('previewArea');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    
    // Digital Clock
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Auto Code Generation Logic (A-1 to G-100 with Recycle)
    function generateMemberCode() {
        const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
        const assignedCodes = new Set(members.map(m => m.code));

        for (let l of letters) {
            for (let i = 1; i <= 100; i++) {
                let code = `${l}-${i}`;
                if (!assignedCodes.has(code)) {
                    return code;
                }
            }
        }
        return "LIMIT-FULL";
    }

    // Back Camera
    async function startBackCamera() {
        try {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
            video.srcObject = videoStream;
        } catch (err) {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = videoStream;
            } catch (fallbackErr) {
                console.log("Camera permissions error");
            }
        }
    }

    // Photo Capture
    snapBtn.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        capturedPhotoData = canvas.toDataURL('image/jpeg');
        capturedImage.src = capturedPhotoData;
        
        cameraArea.style.display = 'none';
        previewArea.style.display = 'flex';
        snapBtn.style.display = 'none';
        retakeBtn.style.display = 'block';
    });

    retakeBtn.addEventListener('click', () => {
        capturedPhotoData = "";
        cameraArea.style.display = 'block';
        previewArea.style.display = 'none';
        snapBtn.style.display = 'block';
        retakeBtn.style.display = 'none';
    });

    // Auto Expiry Date (+1 Month)
    document.getElementById('admissionDate').addEventListener('change', function() {
        if (!this.value) return;
        let admDate = new Date(this.value);
        admDate.setMonth(admDate.getMonth() + 1);
        
        let yyyy = admDate.getFullYear();
        let mm = String(admDate.getMonth() + 1).padStart(2, '0');
        let dd = String(admDate.getDate()).padStart(2, '0');
        
        document.getElementById('expiryDate').value = `${yyyy}-${mm}-${dd}`;
    });

    function initForm() {
        document.getElementById('memberCode').value = generateMemberCode();
        let today = new Date().toISOString().split('T')[0];
        document.getElementById('admissionDate').value = today;
        document.getElementById('admissionDate').dispatchEvent(new Event('change'));
        retakeBtn.click();
    }

    // Save Member
    document.getElementById('memberForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newMember = {
            id: Date.now(),
            code: document.getElementById('memberCode').value,
            name: document.getElementById('fullName').value.trim(),
            whatsapp: document.getElementById('whatsapp').value.trim(),
            admission: document.getElementById('admissionDate').value,
            expiry: document.getElementById('expiryDate').value,
            photo: capturedPhotoData || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="%23334155"><rect width="100%" height="100%"/></svg>'
        };

        members.push(newMember);
        localStorage.setItem('gym_members', JSON.stringify(members));
        
        this.reset();
        initForm();
        renderTable();
    });

    // Render Table
    function renderTable() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const tbody = document.getElementById('membersTable');
        tbody.innerHTML = '';
        const today = new Date().toISOString().split('T')[0];

        members.forEach(m => {
            if (m.name.toLowerCase().includes(query) || m.code.toLowerCase().includes(query)) {
                let cleanPhone = m.whatsapp.replace(/[^0-9]/g, '');
                if (cleanPhone.startsWith('0')) cleanPhone = '92' + cleanPhone.substring(1);
                
                const isPaid = m.expiry >= today;
                let waMessage = encodeURIComponent(`Dear ${m.name} (${m.code}), ${isPaid ? 'aap ki gym fee receive ho chuki hai. Shukriya!' : 'aap ki gym fee due hai. Barae meharbani fee jama karwadein.'}`);
                let waLink = `https://wa.me/${cleanPhone}?text=${waMessage}`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${m.photo}" class="member-img" alt="Member"></td>
                    <td><span class="badge-code">${m.code}</span></td>
                    <td>
                        <strong>${m.name}</strong>
                        <br><span class="badge-status ${isPaid ? 'badge-paid' : 'badge-due'}">${isPaid ? 'PAID' : 'DUE'}</span>
                    </td>
                    <td>
                        <small style="display:block;">Adm: ${m.admission}</small>
                        <small style="color:var(--danger); display:block;">Exp: ${m.expiry}</small>
                    </td>
                    <td class="actions-cell">
                        <a href="${waLink}" target="_blank" class="btn-whatsapp">💬 WA</a>
                        <button onclick="deleteMember(${m.id})" class="btn btn-danger" style="padding: 6px 10px; width:auto; margin-top:0;">X</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    // Delete Member
    window.deleteMember = function(id) {
        if (confirm("Kya aap is member ko delete karna chahte hain? Inka code naye member ke liye free ho jayega.")) {
            members = members.filter(m => m.id !== id);
            localStorage.setItem('gym_members', JSON.stringify(members));
            renderTable();
            document.getElementById('memberCode').value = generateMemberCode();
        }
    };

    window.onload = () => {
        initForm();
        renderTable();
        startBackCamera();
    };
</script>

</body>
</html>
