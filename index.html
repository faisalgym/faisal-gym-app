<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAISAL GYM MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #0066FF; --text: #f0f6fc; --border: #30363d; --danger: #da3633; --success: #238636; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 30px; }
        header { background: var(--card); padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
        header h1 { color: var(--accent); font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 100px; padding: 12px 5px; background: none; border: none; color: #8b949e; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: #1c2128; }
        
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .section-box { display: none; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .section-box.active { display: block; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 10px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 14px; }
        
        .btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-sec { background: #21262d; border: 1px solid var(--border); color: #fff; }
        .btn-danger { background: var(--danger); }
        
        .camera-box { position: relative; width: 100%; height: 220px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--border); text-align: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #capturedPreview { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .member-card { background: #0d1117; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: var(--accent); color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .status-active { color: #3fb950; font-size: 12px; font-weight: bold; }
        .status-expired { color: #f85149; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Faisal Gym Management</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('addTab', event)"><i class="fa-solid fa-user-plus"></i><br>Add Member</button>
        <button class="tab-btn" onclick="switchTab('attendanceTab', event)"><i class="fa-solid fa-camera"></i><br>Attendance</button>
        <button class="tab-btn" onclick="switchTab('membersTab', event)"><i class="fa-solid fa-users"></i><br>Members</button>
    </div>

    <div class="container">
        
        <!-- ADD MEMBER TAB -->
        <div id="addTab" class="section-box active">
            <form id="addMemberForm" onsubmit="saveMember(event)">
                
                <div class="camera-box">
                    <video id="memberCam" autoplay playsinline></video>
                    <img id="capturedPreview" alt="Preview">
                </div>
                
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button type="button" id="btnCapturePhoto" class="btn" onclick="captureMemberPhoto()">Take Photo</button>
                    <button type="button" id="btnOpenRegCam" class="btn btn-sec" onclick="startRegistrationCamera()" style="display:none;">Retake Photo</button>
                </div>

                <input type="hidden" id="mPhotoData">

                <div class="form-group">
                    <label>Auto Member ID</label>
                    <input type="text" id="mAutoId" class="form-control" readonly style="color:#3fb950; font-weight:bold;">
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="mName" class="form-control" placeholder="Enter Member Name" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="mPhone" class="form-control" placeholder="03XXXXXXXXX" required>
                </div>

                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;">
                        <label>Admission Date</label>
                        <input type="date" id="mAdmission" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Expiry Date</label>
                        <input type="date" id="mExpiry" class="form-control" required>
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;">
                        <label>Fee Amount (RS)</label>
                        <input type="number" id="mFeeAmount" class="form-control" value="2000" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Payment Mode</label>
                        <select id="mPaymentMode" class="form-control">
                            <option value="Cash">Cash</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn" style="background:var(--success);">Save Member</button>
            </form>
        </div>

        <!-- ATTENDANCE TAB -->
        <div id="attendanceTab" class="section-box">
            <h3 style="margin-bottom:10px; font-size:16px;">Scan Face / Attendance Camera</h3>
            <div class="camera-box">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <p style="text-align:center; color:#8b949e; font-size:12px;">Camera active for live recognition.</p>
        </div>

        <!-- MEMBERS LIST TAB -->
        <div id="membersTab" class="section-box">
            <h3 style="margin-bottom:15px; font-size:16px;">Registered Members</h3>
            <div id="membersList"></div>
        </div>

    </div>

    <canvas id="memberCanvas" style="display:none;"></canvas>

    <!-- Cache Bypassing Script Link -->
    <script>
        var script = document.createElement('script');
        script.src = 'app.js?v=' + Date.now();
        document.body.appendChild(script);
    </script>
</body>
</html>
