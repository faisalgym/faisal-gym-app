<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAISAL GYM - Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-box">
            <h1>FAISAL <span>GYM</span></h1>
        </div>
        <div class="sys-status">
            <div class="time-badge" id="liveClock">00:00:00 AM</div>
            <div class="status-badge">System Ready</div>
        </div>
    </header>

    <!-- Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('attendanceTab')">Attendance</button>
        <button class="tab-btn" onclick="switchTab('logsTab')">Today Logs</button>
        <button class="tab-btn" onclick="switchTab('membersTab')">Members</button>
        <button class="tab-btn" onclick="switchTab('addTab')">Add Member</button>
    </div>

    <div class="container">

        <!-- Analytics Overview -->
        <div class="dash-cards">
            <div class="card">
                <h2 id="totalActiveCount">0</h2>
                <p>Active Members</p>
            </div>
            <div class="card">
                <h2 id="todayAttendanceCount">0</h2>
                <p>Today Attendance</p>
            </div>
            <div class="card overdue">
                <h2 id="feeOverdueCount">0</h2>
                <p>Fee Overdue</p>
            </div>
        </div>

        <!-- 1. Attendance Tab -->
        <div id="attendanceTab" class="section-box active">
            <div class="section-title">
                <span>Face Scanner / Quick Attendance</span>
                <span style="font-size: 0.75rem; color: #8b949e;">Back Camera Active</span>
            </div>
            <div class="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <div class="cam-overlay">📷 Environment Cam</div>
            </div>
            <button class="btn-primary" onclick="markAutoAttendance()">Mark Attendance</button>
        </div>

        <!-- 2. Logs Tab -->
        <div id="logsTab" class="section-box">
            <div class="section-title">Today's Entry Log</div>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Member</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <!-- Logs inserted dynamically -->
                </tbody>
            </table>
        </div>

        <!-- 3. Members List Tab -->
        <div id="membersTab" class="section-box">
            <div class="section-title">Registered Members</div>
            <div class="form-group">
                <input type="text" id="searchBar" class="form-control" placeholder="Search by ID (e.g. A1) or Name..." onkeyup="filterMembers()">
            </div>
            <div id="membersList">
                <!-- Dynamic Member Cards -->
            </div>
        </div>

        <!-- 4. Add Member Tab -->
        <div id="addTab" class="section-box">
            <div class="section-title">New Member Registration</div>
            <form id="addMemberForm" onsubmit="saveMember(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="mName" class="form-control" required placeholder="Enter member name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="mPhone" class="form-control" required placeholder="03XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label>Fee Expiry Date</label>
                    <input type="date" id="mExpiry" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary">Save Member</button>
            </form>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
