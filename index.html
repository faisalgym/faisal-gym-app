<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faisal Gym Management</title>
  <style>
    :root {
      --bg-color: #0b1320;
      --card-bg: #131e30;
      --accent-color: #ff2a4b;
      --accent-hover: #d61f3c;
      --text-color: #f0f6fc;
      --green-color: #00e676;
      --red-color: #ff2a4b;
      --border-color: #21324e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 12px 15px; border-radius: 10px;
      border: 1px solid var(--border-color); margin-bottom: 15px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color); }
    .brand h1 { font-size: 1.1rem; color: var(--accent-color); letter-spacing: 1px; }
    .digital-clock {
      font-size: 0.95rem; font-weight: bold; background: #050911;
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent-color); color: var(--accent-color);
    }

    .container { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } }

    .card { background: var(--card-bg); padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1rem; color: var(--accent-color); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }

    .scanner-box {
      position: relative; width: 100%; height: 240px; background: #050911;
      border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border-color);
    }
    video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    
    .scan-status-tag {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7);
      padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: #00e676; z-index: 5; font-weight: bold;
    }

    .scan-overlay {
      position: absolute; top: 15px; left: 15px; right: 15px; padding: 15px;
      border-radius: 8px; text-align: center; font-weight: bold; display: none; z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .scan-overlay.green { display: block; background: rgba(0, 230, 118, 0.95); color: #000; border: 2px solid var(--green-color); }
    .scan-overlay.red { display: block; background: rgba(255, 42, 75, 0.95); color: #fff; border: 2px solid var(--red-color); }

    .form-group { margin-top: 8px; }
    .form-group label { font-size: 0.75rem; color: #8fa0bc; display: block; margin-bottom: 3px; }
    
    input, button {
      width: 100%; padding: 10px; border-radius: 6px;
      border: 1px solid var(--border-color); background: #050911; color: #fff; font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: var(--accent-color); }
    input[readonly] { background: #1a273d; color: var(--accent-color); font-weight: bold; }
    button { background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; border: none; margin-top: 8px; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--red-color); color: #fff; }
    .btn-secondary { background: #1a273d; color: #fff; border: 1px solid var(--border-color); }
    
    .btn-whatsapp { 
      background: #25D366; color: #fff; display: inline-flex; align-items: center; justify-content: center;
      gap: 5px; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;
    }
    .btn-whatsapp svg { width: 16px; height: 16px; fill: currentColor; }

    .capture-area { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    .photo-preview { width: 55px; height: 55px; border-radius: 6px; background: #050911; border: 1px solid var(--border-color); object-fit: cover; }

    .member-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; margin-top: 10px; }
    .member-card {
      display: flex; align-items: center; gap: 10px; background: #050911;
      padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
    }
    .member-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color); }
    .member-info { flex: 1; }
    .member-info h4 { font-size: 0.95rem; color: #fff; display: flex; align-items: center; gap: 6px; }
    .member-info p { font-size: 0.78rem; color: #8fa0bc; margin-top: 2px; }

    .badge { display: inline-block; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; font-weight: bold; }
    .badge-green { background: var(--green-color); color: #000; }
    .badge-red { background: var(--red-color); color: #fff; }

    .action-btns { display: flex; gap: 4px; }
    .action-btns button, .action-btns a { margin-top: 0; width: auto; padding: 6px 10px; font-size: 0.8rem; }

    /* Attendance Log Styling */
    .attendance-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.82rem; }
    .attendance-table th, .attendance-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .attendance-table th { background: #050911; color: var(--accent-color); }
    .log-box { max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://i.postimg.cc/3RX1JwMh/FB-IMG-1785949977671.jpg" alt="Logo">
      <h1>FAISAL GYM</h1>
    </div>
    <div class="digital-clock" id="clock">00:00:00 AM</div>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">Live Camera Auto Scanner</div>
      <div class="scanner-box" id="scannerContainer">
        <div class="scan-status-tag" id="aiStatus">LIVE SCANNING 🟢</div>
        <video id="scannerVideo" autoplay playsinline muted></video>
        <div id="scanOverlay" class="scan-overlay">
          <div id="scanName" style="font-size:1.2rem; text-transform: uppercase;">Member Name</div>
          <div id="scanStatus" style="font-size:0.95rem; margin-top:4px;">STATUS</div>
        </div>
      </div>
      <button onclick="manualScanSearch()" class="btn-secondary">🔍 Code Search / Manual Check</button>
    </div>

    <div class="card" id="formCard">
      <div class="card-title" id="formTitle">Member Profile Form</div>
      <form id="memberForm" onsubmit="event.preventDefault(); saveMember();">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
          <label>Member Code</label>
          <input type="text" id="mCode" readonly placeholder="Auto Code">
        </div>

        <div class="form-group">
          <label>Pura Naam</label>
          <input type="text" id="mName" placeholder="Pura Naam Likhein" required>
        </div>
        
        <div class="form-group">
          <label>WhatsApp Mobile Number</label>
          <input type="tel" id="mPhone" placeholder="03001234567" required>
        </div>
        
        <div style="display: flex; gap: 8px;">
          <div class="form-group" style="flex:1;">
            <label>Admission Date</label>
            <input type="date" id="mAdminDate" required onchange="setAutoExpiry()">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Expiry Date (+1 Month)</label>
            <input type="date" id="mExpDate" required>
          </div>
        </div>

        <div class="capture-area">
          <img id="photoPreview" class="photo-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='55' height='55' fill='%2321324e'><rect width='100%' height='100%'/></svg>" alt="Preview">
          <button type="button" onclick="capturePhoto()" class="btn-secondary">📸 Tasveer Khainchein</button>
        </div>

        <button type="submit" id="saveBtn" style="margin-top: 12px;">Save Profile Entry</button>
        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="btn-secondary" style="display:none; margin-top: 5px;">Cancel Editing</button>
      </form>
    </div>
  </div>

  <!-- Attendance History Section -->
  <div class="card" style="margin-top: 15px;">
    <div class="card-title">
      <span>Daily Attendance History Log 📋</span>
      <button onclick="clearAttendanceLog()" class="btn-secondary" style="padding: 4px 8px; font-size:0.75rem; width:auto; margin:0;">🗑️ Clear Log</button>
    </div>
    <div class="log-box">
      <table class="attendance-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Code</th>
            <th>Name</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attendanceLogBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top: 15px;">
    <div class="card-title">
      <span>Saved Member Profiles</span>
      <button onclick="exportData()" class="btn-secondary" style="padding: 4px 8px; font-size:0.75rem; width:auto; margin:0;">📥 Backup Data</button>
    </div>
    
    <input type="text" id="searchInput" placeholder="Search Profile by Name or Code (e.g. A-1)..." onkeyup="renderMembers()" style="margin-top:5px;">
    
    <div class="member-list" id="memberList"></div>
  </div>

  <canvas id="hiddenCanvas" style="display:none;" width="100" height="100"></canvas>

  <script>
    let members = JSON.parse(localStorage.getItem('gym_members')) || [];
    let attendanceLogs = JSON.parse(localStorage.getItem('gym_attendance')) || [];
    let capturedImageData = '';
    let audioCtx = null;
    let scanCooldown = false;

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'paid') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          osc.start(); osc.stop(audioCtx.currentTime + 0.15);
          setTimeout(() => {
            const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(1760, audioCtx.currentTime);
            gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.2);
          }, 150);
        } else {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) {}
    }

    function generateNextCode() {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
      const assignedCodes = new Set(members.map(m => m.code));
      for (let l of letters) {
        for (let i = 1; i <= 100; i++) {
          let code = `${l}-${i}`;
          if (!assignedCodes.has(code)) return code;
        }
      }
      return 'FULL';
    }

    async function startCamera() {
      const video = document.getElementById('scannerVideo');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }, audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallback = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          video.srcObject = fallback;
        } catch (e) {
          const defaultCam = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = defaultCam;
        }
      }
      setInterval(autoScanLoop, 300);
    }

    function getImageFingerprint(imgSource) {
      const canvas = document.getElementById('hiddenCanvas');
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgSource, 0, 0, 100, 100);
      const data = ctx.getImageData(0, 0, 100, 100).data;
      let r = 0, g = 0, b = 0;
      for (let i = 0; i < data.length; i += 16) {
        r += data[i]; g += data[i+1]; b += data[i+2];
      }
      return { r: r/625, g: g/625, b: b/625 };
    }

    function compareFingerprints(fp1, fp2) {
      if (!fp1 || !fp2) return 999;
      return Math.abs(fp1.r - fp2.r) + Math.abs(fp1.g - fp2.g) + Math.abs(fp1.b - fp2.b);
    }

    // Checking if member already scanned TODAY
    function isAlreadyScannedToday(memberCode) {
      const todayDate = new Date().toISOString().split('T')[0];
      return attendanceLogs.some(log => log.code === memberCode && log.dateOnly === todayDate);
    }

    function autoScanLoop() {
      if (scanCooldown || members.length === 0) return;
      const video = document.getElementById('scannerVideo');
      if (!video.videoWidth) return;

      const currentFP = getImageFingerprint(video);

      for (let m of members) {
        if (!m.fingerprint) continue;
        
        // Skip if member already scanned today
        if (isAlreadyScannedToday(m.code)) continue;

        let diff = compareFingerprints(currentFP, m.fingerprint);
        if (diff < 20) {
          scanCooldown = true;
          triggerScanOverlay(m);
          setTimeout(() => { scanCooldown = false; }, 3500);
          break;
        }
      }
    }

    function logAttendance(member, isPaid) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateStr = now.toISOString().split('T')[0];
      
      attendanceLogs.unshift({
        time: `${dateStr} ${timeStr}`,
        dateOnly: dateStr,
        code: member.code,
        name: member.name,
        status: isPaid ? 'PAID' : 'DUE'
      });

      if (attendanceLogs.length > 100) attendanceLogs.pop(); // Keeps recent 100 logs
      localStorage.setItem('gym_attendance', JSON.stringify(attendanceLogs));
      renderAttendanceLog();
    }

    function renderAttendanceLog() {
      const tbody = document.getElementById('attendanceLogBody');
      tbody.innerHTML = '';
      attendanceLogs.forEach(log => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${log.time}</td>
          <td><b>${log.code}</b></td>
          <td>${log.name}</td>
          <td><span class="badge ${log.status === 'PAID' ? 'badge-green' : 'badge-red'}">${log.status}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    function clearAttendanceLog() {
      if (confirm("Daily attendance history clear kar dein?")) {
        attendanceLogs = [];
        localStorage.removeItem('gym_attendance');
        renderAttendanceLog();
      }
    }

    function triggerScanOverlay(member) {
      const today = new Date().toISOString().split('T')[0];
      const isPaid = member.expDate >= today;
      const overlay = document.getElementById('scanOverlay');
      
      document.getElementById('scanName').innerText = `${member.name} (${member.code})`;
      overlay.className = `scan-overlay ${isPaid ? 'green' : 'red'}`;
      document.getElementById('scanStatus').innerText = isPaid ? 'FEE PAID - ACCESS GRANTED' : 'FEE DUE - OVERDUE';

      playSound(isPaid ? 'paid' : 'due');
      logAttendance(member, isPaid);

      setTimeout(() => { overlay.className = 'scan-overlay'; }, 3000);
    }

    function capturePhoto() {
      const video = document.getElementById('scannerVideo');
      if (!video.srcObject) return alert('Camera enable hona zaroori hai.');
      
      const canvas = document.createElement('canvas');
      canvas.width = 220; canvas.height = 220;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 220, 220);
      capturedImageData = canvas.toDataURL('image/png');
      document.getElementById('photoPreview').src = capturedImageData;
    }

    function setAutoExpiry() {
      const adminVal = document.getElementById('mAdminDate').value;
      if (!adminVal) return;
      const d = new Date(adminVal);
      d.setMonth(d.getMonth() + 1);
      document.getElementById('mExpDate').value = d.toISOString().split('T')[0];
    }

    function resetForm() {
      document.getElementById('memberForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('mCode').value = generateNextCode();
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('mAdminDate').value = today;
      setAutoExpiry();
      document.getElementById('photoPreview').src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="55" height="55" fill="%2321324e"><rect width="100%" height="100%"/></svg>';
      capturedImageData = '';
      document.getElementById('saveBtn').innerText = 'Save Profile Entry';
      document.getElementById('formTitle').innerText = 'Member Profile Form';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function saveMember() {
      const editIdx = parseInt(document.getElementById('editIndex').value);
      const code = document.getElementById('mCode').value;
      const name = document.getElementById('mName').value.trim();
      const phone = document.getElementById('mPhone').value.trim();
      const adminDate = document.getElementById('mAdminDate').value;
      const expDate = document.getElementById('mExpDate').value;
      
      let photo = capturedImageData;
      if (!photo && editIdx !== -1) photo = members[editIdx].photo;
      if (!photo) photo = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="55" height="55" fill="%2321324e"><rect width="100%" height="100%"/></svg>';

      const tempImg = new Image();
      tempImg.src = photo;
      tempImg.onload = function() {
        const fp = getImageFingerprint(tempImg);
        const memberData = { code, name, phone, adminDate, expDate, photo, fingerprint: fp };

        if (editIdx === -1) {
          members.push(memberData);
        } else {
          members[editIdx] = memberData;
        }

        localStorage.setItem('gym_members', JSON.stringify(members));
        resetForm();
        renderMembers();
        alert(editIdx === -1 ? 'Member Add Ho Gaya!' : 'Profile Update Ho Gayi!');
      };
    }

    function editMember(index) {
      const m = members[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('mCode').value = m.code;
      document.getElementById('mName').value = m.name;
      document.getElementById('mPhone').value = m.phone;
      document.getElementById('mAdminDate').value = m.adminDate;
      document.getElementById('mExpDate').value = m.expDate;
      document.getElementById('photoPreview').src = m.photo;
      capturedImageData = m.photo;
      
      document.getElementById('saveBtn').innerText = 'Update Member Profile';
      document.getElementById('formTitle').innerText = `Edit Profile (${m.code})`;
      document.getElementById('cancelEditBtn').style.display = 'block';

      document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
    }

    function deleteMember(index) {
      if (confirm(`Profile ${members[index].code} ko delete kar dein?`)) {
        members.splice(index, 1);
        localStorage.setItem('gym_members', JSON.stringify(members));
        resetForm();
        renderMembers();
      }
    }

    function formatPhone(phone) {
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '92' + clean.substring(1);
      return clean;
    }

    function renderMembers() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const list = document.getElementById('memberList');
      list.innerHTML = '';
      const today = new Date().toISOString().split('T')[0];

      members.forEach((m, index) => {
        if (m.name.toLowerCase().includes(query) || m.code.toLowerCase().includes(query)) {
          const isPaid = m.expDate >= today;
          const cleanPhone = formatPhone(m.phone);
          const waMsg = encodeURIComponent(`Dear ${m.name} (${m.code}), ${isPaid ? 'Aap ki gym fee received ho chuki hai. Shukriya!' : 'Aap ki gym fee due hai. Barae meharbani fee jama karwadein.'}`);
          const waUrl = `https://wa.me/${cleanPhone}?text=${waMsg}`;

          const card = document.createElement('div');
          card.className = 'member-card';
          card.innerHTML = `
            <img src="${m.photo}" alt="Photo">
            <div class="member-info">
              <h4>${m.name} <span class="badge ${isPaid ? 'badge-green' : 'badge-red'}">${m.code}</span></h4>
              <p>📱 ${m.phone}</p>
              <p>Expiry: ${m.expDate} (${isPaid ? 'PAID' : 'DUE'})</p>
            </div>
            <div class="action-btns">
              <a href="${waUrl}" target="_blank" class="btn-whatsapp">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                WA
              </a>
              <button onclick="editMember(${index})">Edit</button>
              <button class="btn-danger" onclick="deleteMember(${index})">Delete</button>
            </div>
          `;
          list.appendChild(card);
        }
      });
    }

    function manualScanSearch() {
      if (members.length === 0) return alert('Pehle kisi member ko register karein.');
      const inputCode = prompt("Enter Member Code (e.g. A-1):");
      if (!inputCode) return;
      const m = members.find(item => item.code.toLowerCase() === inputCode.trim().toLowerCase());
      if (!m) return alert('Member nahi mila!');
      triggerScanOverlay(m);
    }

    function exportData() {
      if (members.length === 0) return alert('Backup ke liye koi data nahi hai.');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(members, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `faisal_gym_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
      resetForm();
      renderMembers();
      renderAttendanceLog();
    });
  </script>
</body>
</html>
